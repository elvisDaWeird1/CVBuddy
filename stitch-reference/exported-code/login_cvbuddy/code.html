<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CVBuddy - Login</title>

                    "on-secondary-fixed": "#0f1d25",
                    "primary-container": "#2196f3",

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .shadow-level-1 { box-shadow: 0 4px 20px rgba(33, 150, 243, 0.08); }
        .shadow-level-2 { box-shadow: 0 8px 30px rgba(33, 150, 243, 0.12); }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md md:p-lg antialiased">
<!-- Decorative background elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-30 blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-tertiary-fixed opacity-30 blur-3xl"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-card shadow-level-1 p-lg relative z-10">
<!-- Header -->
<div class="text-center mb-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs font-bold tracking-tight">CVBuddy</h1>
<p class="font-body-md text-body-md text-secondary">Guided Clarity for Your Career.</p>
</div>
<div class="mb-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Welcome back!</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full pl-[44px] pr-sm py-[12px] bg-background border-none rounded-input font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-200" id="email" name="email" placeholder="hello@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full pl-[44px] pr-sm py-[12px] bg-background border-none rounded-input font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-[18px] w-[18px] rounded-[4px] border-outline text-primary-container focus:ring-primary-container bg-background" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-xs font-body-md text-body-md text-on-surface-variant block" for="remember-me">
                    Remember me for 30 days
                </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-btn hover:bg-primary transition-all duration-200 hover:-translate-y-[2px] shadow-sm hover:shadow-level-2 flex justify-center items-center gap-xs" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-lg mb-md flex items-center">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 px-sm font-caption text-caption text-outline">Or continue with</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex justify-center items-center gap-xs py-[10px] px-sm bg-background rounded-input font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors border border-surface-variant">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<button class="flex justify-center items-center gap-xs py-[10px] px-sm bg-background rounded-input font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors border border-surface-variant">
<svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
                GitHub
            </button>
</div>
<!-- Footer -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-secondary">
                Don't have an account? 
                <a class="text-primary font-label-md text-label-md hover:underline transition-all" href="#">Create account</a>
</p>
</div>
</main>
</body></html>
