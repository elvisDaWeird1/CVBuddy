<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - CVBuddy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#004786",
                        "surface-container-high": "#e7e8e9",
                        "primary-fixed-dim": "#9ecaff",
                        "on-tertiary-fixed": "#001c3a",
                        "secondary-fixed-dim": "#bac9d3",
                        "background": "#f8f9fa",
                        "on-secondary-fixed-variant": "#3b4951",
                        "on-primary": "#ffffff",
                        "surface-tint": "#0061a4",
                        "inverse-surface": "#2e3132",
                        "surface-variant": "#e1e3e4",
                        "outline-variant": "#bfc7d4",
                        "secondary": "#526069",
                        "tertiary-fixed": "#d4e3ff",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container": "#edeeef",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "error": "#ba1a1a",
                        "tertiary": "#005faf",
                        "secondary-container": "#d3e2ed",
                        "on-secondary-container": "#56656e",
                        "surface-container-highest": "#e1e3e4",
                        "on-primary-container": "#002c4f",
                        "on-primary-fixed-variant": "#00497d",
                        "on-secondary-fixed": "#0f1d25",
                        "primary-container": "#2196f3",
                        "on-tertiary-container": "#002b55",
                        "tertiary-fixed-dim": "#a5c8ff",
                        "tertiary-container": "#4593f1",
                        "on-primary-fixed": "#001d36",
                        "primary": "#0061a4",
                        "outline": "#707883",
                        "primary-fixed": "#d1e4ff",
                        "on-background": "#191c1d",
                        "surface-dim": "#d9dadb",
                        "inverse-primary": "#9ecaff",
                        "surface-bright": "#f8f9fa",
                        "surface": "#f8f9fa",
                        "on-surface-variant": "#404752",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d6e5ef",
                        "error-container": "#ffdad6",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "card": "16px",
                        "input": "8px",
                        "btn": "12px"
                    },
                    "spacing": {
                        "sm": "16px",
                        "xs": "8px",
                        "md": "24px",
                        "lg": "40px",
                        "base": "4px",
                        "container-max": "1200px",
                        "gutter": "24px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {

                    "boxShadow": {
                        "level-1": "0 4px 20px rgba(33, 150, 243, 0.08)",
                        "level-2": "0 8px 30px rgba(33, 150, 243, 0.12)"

                }
            }
        }
    </script>
<style>
        body {
            background-color: #f8f9fa; /* Level 0 Base */
        }
        .bg-pattern {
            background-image: radial-gradient(#d1e4ff 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-md bg-pattern">
<!-- Linear/Transactional page - Navigation Shell Suppressed -->
<main class="w-full max-w-md mx-auto">
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-card shadow-level-1 p-md md:p-lg transform transition-transform duration-200 hover:shadow-level-2 hover:-translate-y-1">
<!-- Header Section -->
<div class="text-center mb-lg border-b border-surface-container-high pb-md">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Join CVBuddy</h1>
<p class="font-body-md text-body-md text-secondary">Guided Clarity for Your Career.</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-md" method="POST">
<!-- Full Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-[40px] pr-sm py-3 bg-surface rounded-input border-transparent focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all" id="fullName" name="fullName" placeholder="Alex Walker" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-[40px] pr-sm py-3 bg-surface rounded-input border-transparent focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all" id="email" name="email" placeholder="alex@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-[40px] pr-sm py-3 bg-surface rounded-input border-transparent focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<p class="mt-2 font-caption text-caption text-secondary">Must be at least 8 characters long.</p>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="w-full pl-[40px] pr-sm py-3 bg-surface rounded-input border-transparent focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-btn hover:bg-primary transition-colors flex justify-center items-center gap-xs shadow-sm hover:shadow-md" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-secondary">
                    Already have an account? 
                    <a class="text-primary hover:text-primary-container font-label-md transition-colors underline-offset-4 hover:underline" href="#">Log in here</a>
</p>
</div>
</div>
<!-- Supportive graphic area below card -->
<div class="mt-lg flex justify-center items-center opacity-70">
<div class="w-32 h-32 rounded-full bg-primary-fixed-dim blur-[40px] absolute -z-10 mix-blend-multiply"></div>
</div>
</main>
<!-- Footer Component Generated from JSON -->
<footer class="w-full bg-surface-container dark:bg-surface-container-high py-lg px-md md:px-lg max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-sm mt-auto">
<div class="font-label-md text-label-md font-bold text-on-surface dark:text-on-surface-variant">
            © 2024 CVBuddy. Guided Clarity for Your Career.
        </div>
<nav class="flex flex-wrap justify-center gap-md">
<a class="font-caption text-caption text-on-secondary-fixed-variant dark:text-on-secondary-fixed hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all opacity-90 hover:opacity-100" href="#">Help Center</a>
<a class="font-caption text-caption text-on-secondary-fixed-variant dark:text-on-secondary-fixed hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all opacity-90 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-caption text-caption text-on-secondary-fixed-variant dark:text-on-secondary-fixed hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all opacity-90 hover:opacity-100" href="#">Terms of Service</a>
<a class="font-caption text-caption text-on-secondary-fixed-variant dark:text-on-secondary-fixed hover:text-primary dark:hover:text-primary-fixed-dim underline transition-all opacity-90 hover:opacity-100" href="#">Contact Us</a>
</nav>
</footer>
</body></html>
